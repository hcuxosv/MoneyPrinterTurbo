<script type="module">
import * as THREE from 'three';
import { clamp, smooth, ease, easeOut, seg, lerp, hash, window01, rng, canvasTexture, timeline, CamPath,
  textSprite, makeRenderer, envMap, makePipeline, hudPlace, loadFonts } from '/lib.js';

const qs = new URLSearchParams(location.search);
const W = +qs.get('w') || 1920, H = +qs.get('h') || 1080;

const renderer = makeRenderer(W, H);
const pipe = makePipeline(renderer, W, H);
const env = envMap(renderer);
const U = H / 1080; // HUD scale

// ---------------------------------------------------------------- macro world
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
scene.environment = env;
scene.fog = new THREE.Fog(0x04060a, 22, 60);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.005, 200);

scene.add(new THREE.HemisphereLight(0x8fb8ff, 0x0a0a12, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(8, 16, 10); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
key.shadow.bias = -0.0004;
scene.add(key);
const rimA = new THREE.PointLight(0x2bd9ff, 60, 30, 2); rimA.position.set(-7, 5, -6); scene.add(rimA);

// Motherboard: PCB texture with traces; the glowing "data" paths are drawn into it too.
const R = rng(7);
const BOARD = 44, BT = 4096, px = v => (v / BOARD + 0.5) * BT; // world -> texture px
const dataPaths = [];
for (let i = 0; i < 46; i++) {
  const side = i % 4, off = (R() - 0.5) * 30;
  let p0 = side === 0 ? [-21, off] : side === 1 ? [21, off] : side === 2 ? [off, -21] : [off, 21];
  const end = [clamp(p0[0], -2.4, 2.4) * (side < 2 ? 1 : 1), clamp(p0[1], -2.1, 2.1)];
  if (side === 0) end[0] = -3.3; if (side === 1) end[0] = 3.3; if (side === 2) end[1] = -3.0; if (side === 3) end[1] = 3.0;
  end[side < 2 ? 1 : 0] = (R() - 0.5) * (side < 2 ? 3.6 : 4.4);
  const mid = side < 2 ? [lerp(p0[0], end[0], 0.35 + R() * 0.4), p0[1]] : [p0[0], lerp(p0[1], end[1], 0.35 + R() * 0.4)];
  const mid2 = side < 2 ? [mid[0], end[1]] : [end[0], mid[1]];
  dataPaths.push([p0, mid, mid2, end]);
}
const pcbTex = canvasTexture(BT, BT, (g) => {
  g.fillStyle = '#0a100f'; g.fillRect(0, 0, BT, BT);
  const r = rng(3);
  for (let i = 0; i < 2600; i++) { // background traces
    let x = r() * BT, y = r() * BT; g.strokeStyle = `rgba(40,${80 + r() * 50},${70 + r() * 40},${0.25 + r() * 0.35})`;
    g.lineWidth = 1 + r() * 3; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 3; k++) { if (r() < 0.5) x += (r() - 0.5) * 500; else y += (r() - 0.5) * 500; g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 900; i++) { const x = r() * BT, y = r() * BT; g.fillStyle = 'rgba(160,140,90,0.35)'; g.beginPath(); g.arc(x, y, 3 + r() * 4, 0, 7); g.fill(); }
  g.lineCap = 'round';
  for (const p of dataPaths) {
    g.strokeStyle = 'rgba(60,170,170,0.55)'; g.lineWidth = 5; g.beginPath();
    p.forEach(([x, z], j) => j ? g.lineTo(px(x), px(z)) : g.moveTo(px(x), px(z))); g.stroke();
  }
  g.fillStyle = 'rgba(230,235,230,0.8)'; g.font = '600 46px "JetBrains Mono"';
  [['CPU1', 0, -4.2], ['DIMM_A1', 6.9, -6.5], ['DIMM_B1', 9.1, -6.5], ['PCIE_X16', -2, 9.3], ['M2_1', -3, 6.4], ['VRM', -6.4, -6.2]]
    .forEach(([s, x, z]) => g.fillText(s, px(x), px(z)));
  g.strokeStyle = 'rgba(230,235,230,0.55)'; g.lineWidth = 4; g.strokeRect(px(-3.6), px(-3.2), px(3.6) - px(-3.6), px(3.2) - px(-3.2));
});
const board = new THREE.Mesh(new THREE.BoxGeometry(BOARD, 0.16, BOARD),

board.position.y = -0.08; board.receiveShadow = true; scene.add(board);

const metal = (c, r = 0.32, m = 1) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });

};
// RAM slots + sticks
for (let i = 0; i < 4; i++) {
  const x = 6.4 + i * 1.1;
  box(0.45, 0.35, 13, metal(0x15171b, 0.6, 0.1), x, 0.17, 0);
  if (i % 2 === 1) {
    box(0.18, 3.2, 12.4, metal(0x1a1d22, 0.35, 0.85), x, 1.9, 0);

// VRM heatsinks
const fin = metal(0x2a2e35, 0.4, 0.9);
const vrmA = new THREE.Group(); scene.add(vrmA); vrmA.position.set(-5.4, 0, -1);
box(2.2, 1.5, 9.5, fin, 0, 0.75, 0, vrmA);
for (let i = 0; i < 9; i++) box(2.3, 0.08, 9.6, metal(0x3a3f47, 0.35, 0.9), 0, 0.3 + i * 0.16, 0, vrmA);
const vrmB = new THREE.Group(); scene.add(vrmB); vrmB.position.set(0, 0, -6.6);
box(10, 1.5, 2.2, fin, 0, 0.75, 0, vrmB);
// PCIe slot, M.2 heatsink, capacitors
box(14, 0.5, 0.6, metal(0x111317, 0.5, 0.2), -1, 0.25, 9);
box(9, 0.35, 2.4, metal(0x30343b, 0.3, 0.9), -1.5, 0.18, 5.6);
const capGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.9, 20);
for (let i = 0; i < 10; i++) {

}

// Socket (LGA): steel frame around a field of gold contacts, with a lever.
const contactTex = canvasTexture(1024, 900, (g, w, h) => {
  g.fillStyle = '#121212'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#d9b25a';
  for (let y = 14; y < h - 10; y += 15) for (let x = 14 + (y / 15 % 2) * 7; x < w - 10; x += 15) {
    if (x > w * 0.38 && x < w * 0.62 && y > h * 0.38 && y < h * 0.62) continue; g.fillRect(x, y, 6, 6);
  }
});
const socket = new THREE.Group(); scene.add(socket);
const steel = metal(0xa9aeb5, 0.28, 1);
box(5.4, 0.12, 4.6, new THREE.MeshStandardMaterial({ map: contactTex, roughness: 0.45, metalness: 0.6 }), 0, 0.06, 0, socket);
box(6.2, 0.36, 0.45, steel, 0, 0.18, -2.52, socket); box(6.2, 0.36, 0.45, steel, 0, 0.18, 2.52, socket);
box(0.45, 0.36, 4.6, steel, -2.9, 0.18, 0, socket); box(0.45, 0.36, 4.6, steel, 2.9, 0.18, 0, socket);
const lever = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 5.4, 12), steel);

// CPU: substrate + die + integrated heat spreader (IHS).
const DIE_W = 2.3, DIE_D = 1.45, DT_W = 4096, DT_H = Math.round(4096 * DIE_D / DIE_W);
const cores = [];
for (let row = 0; row < 2; row++) for (let i = 0; i < 4; i++)
  cores.push({ x: 0.2 + i * 0.152, y: row ? 0.6 : 0.06, w: 0.142, h: 0.34 });
const cache = { x: 0.2, y: 0.425, w: 0.6, h: 0.15 };
const dieTex = canvasTexture(DT_W, DT_H, (g, w, h) => {
  const r = rng(11);
  const grd = g.createLinearGradient(0, 0, w, h);
  grd.addColorStop(0, '#1a1030'); grd.addColorStop(0.5, '#0f1a2a'); grd.addColorStop(1, '#22142a');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  const hue = (x, y) => 200 + 120 * Math.sin(x * 3.1 + y * 5.3) * 0.5 + 60;
  const block = (bx, by, bw, bh, n, sat = 55, light = [25, 55]) => {
    for (let i = 0; i < n; i++) {
      const x = bx + r() * bw, y = by + r() * bh, ww = r() * bw * 0.25, hh = r() * bh * 0.25;
      g.fillStyle = `hsla(${hue(x / w, y / h) + (r() - 0.5) * 50},${sat}%,${light[0] + r() * (light[1] - light[0])}%,${0.35 + r() * 0.5})`;
      g.fillRect(x, y, Math.min(ww, bx + bw - x), Math.min(hh, by + bh - y));
    }
  };
  const grid = (bx, by, bw, bh, cell, col) => {
    g.fillStyle = col;
    for (let y = by; y < by + bh - cell * 0.6; y += cell) for (let x = bx; x < bx + bw - cell * 0.6; x += cell) g.fillRect(x, y, cell * 0.72, cell * 0.72);
  };
  // I/O pad ring
  g.fillStyle = '#c9a04a';
  for (let x = 30; x < w - 30; x += 42) { g.fillRect(x, 12, 22, 22); g.fillRect(x, h - 34, 22, 22); }
  for (let y = 60; y < h - 60; y += 42) { g.fillRect(12, y, 22, 22); g.fillRect(w - 34, y, 22, 22); }
  // iGPU (left), memory/IO (right)
  grid(w * 0.035, h * 0.08, w * 0.15, h * 0.84, 22, 'rgba(60,200,150,0.45)'); block(w * 0.035, h * 0.08, w * 0.15, h * 0.84, 500, 60);
  for (let y = h * 0.08; y < h * 0.92; y += 18) { g.fillStyle = `rgba(220,180,90,${0.25 + r() * 0.4})`; g.fillRect(w * 0.82, y, w * 0.15, 8); }
  // L3 cache: very regular SRAM arrays
  grid(w * cache.x, h * cache.y, w * cache.w, h * cache.h, 12, 'rgba(120,110,255,0.55)');
  for (let i = 1; i < 8; i++) { g.fillStyle = 'rgba(10,10,20,0.9)'; g.fillRect(w * (cache.x + i * cache.w / 8) - 4, h * cache.y, 8, h * cache.h); }
  // Cores
  for (const c of cores) {
    const X = c.x * w, Y = c.y * h, CW = c.w * w, CH = c.h * h;
    g.fillStyle = 'rgba(8,8,14,0.85)'; g.fillRect(X - 6, Y - 6, CW + 12, CH + 12);
    block(X, Y, CW, CH * 0.62, 1600, 70, [30, 62]);
    grid(X + CW * 0.05, Y + (c.y > 0.5 ? 0 : CH * 0.66), CW * 0.9, CH * 0.32, 10, 'rgba(150,120,255,0.5)'); // L2
    g.strokeStyle = 'rgba(255,210,120,0.55)'; g.lineWidth = 5; g.strokeRect(X, Y, CW, CH);
  }
  // fine wiring sheen
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(255,255,255,${r() * 0.06})`; g.fillRect(r() * w, r() * h, r() * 60, 2); }
}, { aniso: 16 });

const cpu = new THREE.Group(); scene.add(cpu);
const subTop = canvasTexture(1024, 860, (g, w, h) => {
  g.fillStyle = '#1d4d34'; g.fillRect(0, 0, w, h);
  const r = rng(5);
  for (let i = 0; i < 260; i++) { const x = r() * w, y = r() * h; if (x > w * 0.12 && x < w * 0.88 && y > h * 0.12 && y < h * 0.88) continue;
    g.fillStyle = r() < 0.5 ? '#c7a24f' : '#8b8f96'; g.fillRect(x, y, 14, 7); }
  g.fillStyle = '#d9b25a'; g.beginPath(); g.moveTo(10, 10); g.lineTo(60, 10); g.lineTo(10, 60); g.fill();
});
const subBot = canvasTexture(1024, 860, (g, w, h) => {
  g.fillStyle = '#1d4d34'; g.fillRect(0, 0, w, h); g.fillStyle = '#e0b85c';
  for (let y = 16; y < h - 12; y += 17) for (let x = 16 + (y / 17 % 2) * 8; x < w - 12; x += 17) {
    if (x > w * 0.36 && x < w * 0.64 && y > h * 0.36 && y < h * 0.64) continue; g.beginPath(); g.arc(x, y, 5.5, 0, 7); g.fill(); }
});
const green = new THREE.MeshStandardMaterial({ color: 0x1d4d34, roughness: 0.55, metalness: 0.1 });
const substrate = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.14, 3.75), [green, green,
  new THREE.MeshStandardMaterial({ map: subTop, roughness: 0.5, metalness: 0.2 }),
  new THREE.MeshStandardMaterial({ map: subBot, roughness: 0.3, metalness: 0.8 }), green, green]);
substrate.position.y = 0.07; substrate.castShadow = substrate.receiveShadow = true; cpu.add(substrate);
const dieSide = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.3, metalness: 0.6 });
const dieMat = new THREE.MeshStandardMaterial({ map: dieTex, roughness: 0.22, metalness: 0.55, emissive: 0xffffff, emissiveMap: dieTex, emissiveIntensity: 0.0 });
const die = new THREE.Mesh(new THREE.BoxGeometry(DIE_W, 0.07, DIE_D), [dieSide, dieSide, dieMat, dieSide, dieSide, dieSide]);
die.castShadow = true; cpu.add(die);
const DIE_REST = 0.175;
// glow overlays for cores and cache (additive planes on the die)
const overlay = (c, color) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(c.w * DIE_W, c.h * DIE_D),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  m.rotation.x = -Math.PI / 2; m.position.set((c.x + c.w / 2 - 0.5) * DIE_W, 0.0365, (c.y + c.h / 2 - 0.5) * DIE_D);
  die.add(m); return m;
};
const coreGlow = cores.map(c => overlay(c, new THREE.Color(0x30d8ff).multiplyScalar(2.2)));
const cacheGlow = overlay(cache, new THREE.Color(0xffb13b).multiplyScalar(2.0));

const ihsTex = canvasTexture(1400, 1230, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#d6d9de'); grd.addColorStop(1, '#b9bdc4');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  const r = rng(9); for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(255,255,255,${r() * 0.08})`; g.fillRect(0, r() * h, w, 1); }
  g.fillStyle = 'rgba(70,74,82,0.9)'; g.font = '800 110px "Inter Display"'; g.fillText('CORE  X9', 120, 300);
  g.font = '600 64px "JetBrains Mono"'; g.fillText('8 CORES · 5.0 GHz', 120, 420); g.fillText('SN 2026-11-CPU', 120, 520);
  g.font = '600 50px "JetBrains Mono"'; g.fillText('MADE OF SAND, POWERED BY MATH', 120, h - 140);
});
const ihs = new THREE.Group(); cpu.add(ihs);
const nickel = metal(0xc7cbd1, 0.26, 1);
box(4.1, 0.12, 3.4, nickel, 0, 0, 0, ihs);
box(3.3, 0.18, 2.9, [nickel, nickel, new THREE.MeshStandardMaterial({ map: ihsTex, roughness: 0.24, metalness: 1 }), nickel, nickel, nickel], 0, 0.15, 0, ihs);
const IHS_REST = 0.26;

// Tower cooler
const cooler = new THREE.Group(); scene.add(cooler);
const copper = metal(0xc8794a, 0.3, 1);
box(2.6, 0.32, 2.6, copper, 0, 0.16, 0, cooler);
for (let i = 0; i < 4; i++) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 6.5, 14), copper); p.position.set(-0.9 + i * 0.6, 3.4, 0); p.castShadow = true; cooler.add(p); }
const finMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(5.6, 0.045, 3.0), metal(0xb8bec6, 0.35, 1), 44);
const mtx = new THREE.Matrix4();
for (let i = 0; i < 44; i++) finMesh.setMatrixAt(i, mtx.makeTranslation(0, 1.4 + i * 0.12, 0));
finMesh.castShadow = true; cooler.add(finMesh);
const fan = new THREE.Group(); fan.position.set(0, 4.0, 1.85); cooler.add(fan);
box(5.6, 5.6, 0.5, metal(0x0d0f12, 0.6, 0.2), 0, 0, -0.05, fan).scale.set(1, 1, 1);
const blades = new THREE.Group(); fan.add(blades); blades.position.z = 0.3;
for (let i = 0; i < 7; i++) { const b = box(2.3, 0.75, 0.05, new THREE.MeshStandardMaterial({ color: 0x1b2028, roughness: 0.5, emissive: 0x2bd9ff, emissiveIntensity: 0.15 }), 1.2, 0, 0, new THREE.Group()); b.rotation.x = 0.4; const p = b.parent; p.rotation.z = i / 7 * Math.PI * 2; blades.add(p); }
const ring = new THREE.Mesh(new THREE.TorusGeometry(2.55, 0.06, 8, 64), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x2bd9ff).multiplyScalar(2.5), toneMapped: false }));
ring.position.z = 0.3; fan.add(ring);
const coolerMats = []; cooler.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; coolerMats.push(o.material); } });

// Data pulses travelling along the board paths into the socket
const pulseGeo = new THREE.SphereGeometry(0.11, 10, 8);
const PULSES = dataPaths.length * 3;
const pulses = new THREE.InstancedMesh(pulseGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(0x45e6ff).multiplyScalar(3), toneMapped: false }), PULSES);
scene.add(pulses);
const pathPoint = (p, u) => {
  const segs = [], lens = []; let tot = 0;
  for (let i = 0; i < p.length - 1; i++) { const l = Math.hypot(p[i + 1][0] - p[i][0], p[i + 1][1] - p[i][1]); lens.push(l); tot += l; }
  let d = u * tot;
  for (let i = 0; i < lens.length; i++) { if (d <= lens[i] || i === lens.length - 1) { const v = lens[i] ? d / lens[i] : 0; return [lerp(p[i][0], p[i + 1][0], v), lerp(p[i][1], p[i + 1][1], v)]; } d -= lens[i]; }
};

// World labels
const label = (title, sub, h = 0.6, right = false, anchor = null) => {
  const s = textSprite([{ text: title, size: 54, weight: 900, spacing: 3, color: '#e4ebf0' }, ...(sub ? [{ text: sub, size: 34, weight: 600, color: '#9fe8ff' }] : [])],
    { height: h * (sub ? 1.6 : 1), align: 'left', anchor: anchor || [right ? 1 : 0, 0.5] });
  scene.add(s); return s;
};
const lbl = {
  socket: label('SOCKET', 'locks the CPU to the board'),
  board: label('MOTHERBOARD', 'connects every part'),
  cooler: label('COOLER', 'pulls the heat away'),
  ihs: label('HEAT SPREADER', 'metal lid, moves heat out', 0.5, true),
  die: label('DIE', 'the actual silicon chip', 0.5),
  sub: label('SUBSTRATE', '1,000+ contacts to the board', 0.5, true),
  cores: label('CORES', 'mini brains, working in parallel', 0.11, false, [0.5, 0.5]),
  cache: label('CACHE', 'super fast memory, right next door', 0.11, false, [0.5, 0.5]),
  chefs: label('CORES = CHEFS', null, 0.2, false, [0.5, 0.5]),
  counter: label('CACHE = COUNTER', null, 0.2, false, [0.5, 0.5]),
};

// ---------------------------------------------------------------- micro world (transistors)
const micro = new THREE.Scene();
micro.background = new THREE.Color(0x020308);
micro.environment = env;
micro.fog = new THREE.FogExp2(0x020308, 0.028);
const mcam = new THREE.PerspectiveCamera(45, W / H, 0.05, 300);
micro.add(new THREE.HemisphereLight(0x7aa6ff, 0x050508, 0.5));
const mkey = new THREE.DirectionalLight(0xffffff, 1.6); mkey.position.set(10, 20, 6); micro.add(mkey);
const mrim = new THREE.PointLight(0xa040ff, 80, 40, 2); mrim.position.set(-6, 6, -8); micro.add(mrim);
const N = 44, SP = 2.2;
const groundTex = canvasTexture(1024, 1024, (g, w, h) => {
  g.fillStyle = '#0b0c16'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(90,100,180,0.35)'; g.lineWidth = 2;
  for (let i = 0; i <= 16; i++) { g.beginPath(); g.moveTo(i * w / 16, 0); g.lineTo(i * w / 16, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 16); g.lineTo(w, i * h / 16); g.stroke(); }
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(N * SP / 16 * 4, N * SP / 16 * 4);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(N * SP * 2, N * SP * 2), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.4, metalness: 0.6 }));
ground.rotation.x = -Math.PI / 2; micro.add(ground);
const cellPos = (i, j) => [(i - N / 2 + 0.5) * SP, (j - N / 2 + 0.5) * SP];
const FOCAL = Math.floor(N / 2) * N + Math.floor(N / 2);
const inst = (geo, mat, perCell, place) => {
  const m = new THREE.InstancedMesh(geo, mat, N * N * perCell);
  const M = new THREE.Matrix4(); let k = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) for (let s = 0; s < perCell; s++) {
    const [x, z] = cellPos(i, j); const [ox, oy, oz] = place(s); m.setMatrixAt(k++, M.makeTranslation(x + ox, oy, z + oz));
  }
  micro.add(m); return m;
};
inst(new THREE.BoxGeometry(0.14, 0.5, 1.7), new THREE.MeshStandardMaterial({ color: 0x6b7bd6, roughness: 0.35, metalness: 0.5 }), 3, s => [(s - 1) * 0.36, 0.25, 0]);
inst(new THREE.BoxGeometry(1.3, 0.42, 0.42), copper, 2, s => [0, 0.21, s ? 0.66 : -0.66]);
inst(new THREE.BoxGeometry(1.45, 0.72, 0.36), new THREE.MeshStandardMaterial({ color: 0x8c96a8, roughness: 0.3, metalness: 1 }), 1, () => [0, 0.36, 0]);
const glowStrips = inst(new THREE.BoxGeometry(1.36, 0.06, 0.3), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), 1, () => [0, 0.75, 0]);
const cOn = new THREE.Color(0x38e6ff).multiplyScalar(3.2), cOff = new THREE.Color(0x0b1830), cMid = new THREE.Color();
for (let r = 0; r < N; r += 2) { // copper interconnect rails above
  const [, z] = cellPos(0, r); const rail = new THREE.Mesh(new THREE.BoxGeometry(N * SP, 0.12, 0.18), metal(0xb87345, 0.3, 1)); rail.position.set(0, 2.1 + (r % 4) * 0.25, z + 1.1); micro.add(rail);
}
const bit = { one: textSprite([{ text: '1', size: 200, weight: 900, color: '#bff6ff', font: 'JetBrains Mono' }], { height: 1.6, pill: false }),
  zero: textSprite([{ text: '0', size: 200, weight: 900, color: '#6f86a8', font: 'JetBrains Mono' }], { height: 1.6, pill: false }) };
const [fx, fz] = cellPos(N / 2, N / 2);
for (const s of Object.values(bit)) { s.position.set(fx + 1.6, 1.4, fz); micro.add(s); }
const tLabel = textSprite([{ text: 'TRANSISTOR', size: 54, weight: 900, spacing: 3, color: '#ffffff' }, { text: 'a microscopic on/off switch', size: 34, weight: 600, color: '#9fe8ff' }],
  { height: 0.55, align: 'left', anchor: [1, 0.5] });
tLabel.position.set(fx - 1.0, 1.5, fz); micro.add(tLabel);

// ---------------------------------------------------------------- HUD
const hud = (lines, opts) => { const s = textSprite(lines, opts); pipe.hud.add(s); return s; };
const H1 = (t, c = '#ffffff') => ({ text: t, size: 120, weight: 900, spacing: 2, color: c });
const SUB = (t, c = '#9fe8ff') => ({ text: t, size: 58, weight: 600, color: c });
const H_ = {
  brain: hud([H1('THE BRAIN'), SUB('central processing unit · CPU')], { pill: false }),
  billions: hud([{ text: 'BILLIONS', size: 120, weight: 900, color: '#ffffff' }, SUB('of switches in one chip')], {}),
  ghz: hud([{ text: '5 GHz', size: 150, weight: 900, color: '#ffffff' }, SUB('= 5,000,000,000 steps every second', '#ffd27a')], { pill: false }),
  cores: hud([{ text: 'MORE CORES', size: 64, weight: 900, color: '#ffffff' }, SUB('multitasking · streaming · editing')], { align: 'left', anchor: [0, 0.5] }),
  clock: hud([{ text: 'HIGHER GHz', size: 64, weight: 900, color: '#ffffff' }, SUB('snappy, smooth gaming', '#ffd27a')], { align: 'left', accent: '#ffb13b', anchor: [0, 0.5] }),
  title: hud([{ text: 'CPU', size: 170, weight: 900, spacing: 6, color: '#ffffff' }, SUB('the brain of your PC')], { pill: false }),
  count: hud([{ text: '6 – 16', size: 110, weight: 900, color: '#ffffff' }, SUB('cores in most CPUs today')], {}),
};
const hudCounter = { sprite: null, text: '' };
const setHud = (s, opacity, x, y, hPx, slide = 0) => { s.material.opacity = opacity; s.visible = opacity > 0.001; hudPlace(s, x * W, y * H + slide * (1 - opacity) * 40 * U, hPx * U); };

// ---------------------------------------------------------------- choreography
const hk = S('hook'), so = S('socket'), ex = S('explode'), co = S('cores'), tr = S('transistors'), cl = S('clock'), bu = S('buy');
const ex1 = L('explode', 1), ex2 = L('explode', 2), ex3 = L('explode', 3);
const co1 = L('cores', 1), co2 = L('cores', 2);
const tr0 = L('transistors', 0), tr1 = L('transistors', 1), tr2 = L('transistors', 2), tr3 = L('transistors', 3);
const cl1 = L('clock', 1), cl2 = L('clock', 2);
const bu1 = L('buy', 1), bu2 = L('buy', 2), bu3 = L('buy', 3);
const toMicro = tr0.start + (tr0.end - tr0.start) * 0.55;   // flash on "and deeper"
const toMacro = tr3.end - 0.15;                             // flash on "everything"
const CPU_HOVER = 3.2;

const camKeys = new CamPath([
  // hook: low dramatic orbit around the floating chip, then reveal the board
  { t: 0, p: [4.6, 4.6, 7.4], l: [0, 3.0, 0], fov: 32 },
  { t: hk.lines[1].start, p: [-3.4, 5.4, 7.6], l: [0, 2.8, 0], fov: 34 },
  { t: hk.end, p: [-9, 10, 13], l: [0, 1.2, 0], fov: 38 },
  // socket: 3/4 view of the board, chip drops in, cooler lands
  { t: so.lines[1].start, p: [-7.5, 8.5, 10.5], l: [0.5, 0.3, 0], fov: 36 },
  { t: so.end, p: [-10, 11, 13], l: [0, 3, 0], fov: 38 },
  // explode: side view of the layers
  { t: ex.lines[0].end, p: [8.5, 8.0, 11.5], l: [0, 4.0, 0], fov: 36 },
  { t: ex1.end, p: [6.0, 8.6, 10.8], l: [0, 4.6, 0], fov: 38 },
  { t: ex2.end, p: [4.6, 7.4, 10.4], l: [0, 4.4, 0], fov: 38 },
  { t: ex3.start + 0.4, p: [3.6, 2.6, 10.0], l: [0, 4.0, 0], fov: 40 },
  { t: ex3.end, p: [2.8, 2.5, 9.2], l: [0, 4.0, 0], fov: 40 },
  // cores: dive to the die top
  { t: co.lines[0].end, p: [0.4, CPU_HOVER + 2.4, 1.6], l: [0, CPU_HOVER + 0.2, 0], fov: 38 },
  { t: co1.start + 1.2, p: [0.1, CPU_HOVER + 2.0, 0.9], l: [0, CPU_HOVER + 0.2, 0], fov: 38 },
  { t: co2.start, p: [-0.3, CPU_HOVER + 1.8, 1.1], l: [0, CPU_HOVER + 0.2, 0.02], fov: 36 },
  { t: co.end, p: [0.2, CPU_HOVER + 1.4, 0.7], l: [0, CPU_HOVER + 0.2, 0], fov: 36 },
  // transistors: plunge into one core (macro), then flash into the micro world
  { t: tr0.start + 0.2, p: [-0.38, CPU_HOVER + 0.9, -0.05], l: [-0.42, CPU_HOVER + 0.2, -0.33], fov: 36 },
  { t: toMicro, p: [-0.42, CPU_HOVER + 0.23, -0.30], l: [-0.42, CPU_HOVER + 0.2, -0.36], fov: 30, linear: true },
  { t: toMacro, p: [-0.42, CPU_HOVER + 0.23, -0.30], l: [-0.42, CPU_HOVER + 0.2, -0.36], fov: 30 },
  // clock: angled view of the die, then pull out
  { t: toMacro + 0.01, p: [2.2, CPU_HOVER + 3.4, 3.6], l: [0, CPU_HOVER + 0.2, 0], fov: 34 },
  { t: cl1.start, p: [1.2, CPU_HOVER + 2.5, 2.0], l: [0, CPU_HOVER + 0.2, 0], fov: 36 },
  { t: cl2.start, p: [-1.3, CPU_HOVER + 2.6, 2.2], l: [0, CPU_HOVER + 0.2, 0], fov: 36 },
  { t: cl.end, p: [-3.5, CPU_HOVER + 3.0, 5.0], l: [0, CPU_HOVER + 0.3, 0], fov: 34 },
  // buy: hero orbit of the reassembled chip
  { t: bu1.start, p: [-6.0, CPU_HOVER + 2.4, 6.5], l: [1.4, CPU_HOVER, 0], fov: 32 },
  { t: bu3.start, p: [4.5, CPU_HOVER + 2.2, 7.6], l: [-1.2, CPU_HOVER + 0.2, 0], fov: 32 },
  { t: duration, p: [0.0, CPU_HOVER + 4.2, 9.5], l: [0, CPU_HOVER + 0.6, 0], fov: 30 },
]);
const microKeys = new CamPath([
  { t: toMicro, p: [fx - 14, 26, fz + 22], l: [fx, 0, fz], fov: 50 },
  { t: tr1.end, p: [fx - 5, 6.5, fz + 9], l: [fx, 0.4, fz], fov: 45 },
  { t: tr2.start, p: [fx - 2.6, 3.0, fz + 4.4], l: [fx + 0.4, 0.8, fz], fov: 42 },
  { t: tr2.end, p: [fx - 1.9, 2.4, fz + 3.6], l: [fx + 0.5, 0.8, fz], fov: 42 },
  { t: tr3.start + 1.2, p: [fx - 6, 8, fz + 12], l: [fx, 0, fz], fov: 48 },
  { t: toMacro, p: [fx - 22, 34, fz + 34], l: [fx + 4, 0, fz - 6], fov: 55 },
]);

function placeLabel(s, opacity, x, y, z) { s.material.opacity = opacity; s.visible = opacity > 0.001; s.position.set(x, y, z); }

window.renderAt = (t) => {
  const inMicro = t >= toMicro && t < toMacro;
  // ---- CPU state
  const drop = seg(t, so.start + 0.2, so.lines[0].end, ease);
  const lift = seg(t, ex.lines[0].start, ex.lines[0].end + 0.4);
  const cpuY = lerp(CPU_HOVER, 0, drop) + lift * CPU_HOVER;
  const bob = Math.sin(t * 1.3) * 0.06 * (1 - drop + lift);
  cpu.position.y = cpuY + bob;
  const spin = (t < so.start ? t * 0.35 : 0) * (1 - drop);
  const heroSpin = seg(t, bu.start, duration, x => x) * Math.PI * 0.6;
  cpu.rotation.y = spin + (t > bu.start ? heroSpin : 0) + 0.15 * seg(t, ex.start, ex.end) * Math.sin(t * 0.4);
  if (t > co.start) cpu.rotation.y *= 1 - seg(t, co.start, co.lines[0].end); // square up for the die close-up
  if (t > bu.start) cpu.rotation.y = heroSpin;
  const ihsOpen = seg(t, ex1.start, ex1.start + 1.0);
  const ihsAway = seg(t, co.start, co.lines[0].end + 0.3);
  const ihsBack = seg(t, bu.start, bu.lines[0].end, ease);
  ihs.position.y = IHS_REST + lerp(ihsOpen * 2.4 + ihsAway * 6, 0, ihsBack);
  ihs.position.x = ihsAway * (1 - ihsBack) * 3;
  ihs.visible = ihsAway * (1 - ihsBack) < 0.98;
  const dieOpen = seg(t, ex2.start, ex2.start + 1.0) * (1 - seg(t, co.start, co.lines[0].end));
  die.position.y = DIE_REST + dieOpen * 1.0;
  dieMat.emissiveIntensity = 0.12 * window01(t, ex2.start, ex2.end + 0.5) + 0.05 * (t > co.start ? 1 : 0);
  // cores light one after another, cache glows on its line, clock pulses later
  const tick = 0.5 + 0.5 * Math.cos(t * Math.PI * 4);
  coreGlow.forEach((m, i) => {
    let o = window01(t, co1.start + 0.5 + i * 0.32, co2.start + 0.3, 0.25, 0.5) * 0.55;
    o += window01(t, cl.start, cl.end, 0.5, 0.6) * (0.15 + 0.45 * Math.pow(tick, 3));
    o += window01(t, tr0.start, toMicro, 0.3, 0.1) * 0.25;
    m.material.opacity = o;
  });
  cacheGlow.material.opacity = window01(t, co2.start, co.end + 0.3, 0.4, 0.4) * 0.6 + window01(t, cl1.start + 1.6, cl2.start + 0.3) * 0.5;

  // ---- cooler
  const cDown = seg(t, so.lines[1].start - 0.3, so.lines[1].end - 0.2, easeOut);
  const cUp = seg(t, ex.start, ex.lines[0].end + 0.2, ease);
  cooler.position.y = lerp(14, 0.55, cDown) + cUp * 16;
  cooler.visible = cDown > 0 && cUp < 1;
  coolerMats.forEach(m => { m.opacity = 1 - cUp; m.depthWrite = cUp < 0.05; });
  blades.rotation.z = t * 9;

  // ---- data pulses
  const pulseOn = window01(t, hk.lines[1].start - 0.2, so.end, 0.6, 0.8);
  pulses.visible = pulseOn > 0.01;
  for (let i = 0; i < PULSES; i++) {
    const p = dataPaths[i % dataPaths.length]; const u = (t * (0.18 + hash(i) * 0.15) + hash(i, 3)) % 1;
    const [x, z] = pathPoint(p, u); const s = pulseOn * smooth(u * 6) * (1 - smooth((u - 0.9) * 10));
    pulses.setMatrixAt(i, mtx.makeScale(s, s, s).setPosition(x, 0.05, z));
  }
  pulses.instanceMatrix.needsUpdate = true;

  // ---- world labels
  placeLabel(lbl.socket, window01(t, so.lines[0].start + 0.8, so.lines[1].start + 0.3), 3.6, 0.8, 2.4);
  placeLabel(lbl.board, window01(t, so.lines[0].start + 1.6, so.lines[1].start + 0.6), 6.0, 0.6, 7.0);
  placeLabel(lbl.cooler, window01(t, so.lines[1].start + 0.6, so.end), 3.4, 6.5, 2.0);
  const cpuW = cpu.position.y;
  placeLabel(lbl.ihs, window01(t, ex1.start + 0.6, ex3.end), -2.3, cpuW + ihs.position.y + 0.3, 0.6);
  placeLabel(lbl.die, window01(t, ex2.start + 0.6, ex3.end), 1.5, cpuW + die.position.y + 0.1, 0.4);
  placeLabel(lbl.sub, window01(t, ex3.start + 0.4, ex3.end), -2.4, cpuW - 0.1, 1.2);
  placeLabel(lbl.cores, window01(t, co1.start + 0.8, co2.start + 0.2), -0.3, cpuW + 0.45, 0.32);
  placeLabel(lbl.cache, window01(t, co2.start + 0.5, co.end), 0.0, cpuW + 0.45, 0.0);
  placeLabel(lbl.chefs, window01(t, cl1.start + 0.2, cl2.start + 0.2), 0.1, cpuW + 0.5, -0.4);
  placeLabel(lbl.counter, window01(t, cl1.start + 1.8, cl2.start + 0.2), 0.1, cpuW + 0.5, 0.05);

  // ---- cameras
  const ck = camKeys.at(t);
  camera.position.set(...ck.p); camera.lookAt(...ck.l); camera.fov = ck.fov; camera.updateProjectionMatrix();
  let activeScene = scene, activeCam = camera;
  if (inMicro) {
    const mk = microKeys.at(t);
    mcam.position.set(...mk.p); mcam.lookAt(...mk.l); mcam.fov = mk.fov; mcam.updateProjectionMatrix();
    activeScene = micro; activeCam = mcam;
    // transistor states: random flicker, speeding up as the field is revealed
    const dimOthers = window01(t, tr2.start - 0.2, tr2.end + 0.2, 0.3, 0.4);
    const rate = lerp(3, 26, seg(t, tr3.start + 0.5, toMacro, x => x * x));
    const step = Math.floor(t * rate);
    const words = (t - tr2.start) / (tr2.end - tr2.start); const beat = Math.floor(clamp(words, 0, 0.999) * 4);
    const focalOn = t >= tr2.start && t < tr2.end ? beat % 2 === 0 : hash(FOCAL, step) > 0.5;
    for (let k = 0; k < N * N; k++) {
      const on = k === FOCAL ? focalOn : hash(k, step) > 0.55;
      cMid.copy(on ? cOn : cOff); if (k !== FOCAL) cMid.lerp(cOff, dimOthers * 0.85);
      glowStrips.setColorAt(k, cMid);
    }
    glowStrips.instanceColor.needsUpdate = true;
    const bitShow = window01(t, tr2.start - 0.1, tr3.start + 1.4, 0.15, 0.4);
    bit.one.material.opacity = focalOn ? bitShow : 0; bit.zero.material.opacity = focalOn ? 0 : bitShow;
    tLabel.material.opacity = window01(t, tr1.start + 0.8, tr2.end, 0.4, 0.4);
  }

  // ---- HUD
  setHud(H_.brain, window01(t, hk.lines[0].start + 2.4, hk.lines[1].start + 0.6, 0.4, 0.5), 0.5, 0.76, 230, 1);
  setHud(H_.count, window01(t, co1.start + 2.6, co2.start, 0.35, 0.4), 0.2, 0.8, 190, 1);
  setHud(H_.billions, window01(t, tr1.start + 2.2, tr2.start - 0.1, 0.3, 0.3), 0.5, 0.78, 230, 1);
  setHud(H_.ghz, window01(t, cl2.start + 1.6, cl.end, 0.35, 0.4), 0.5, 0.76, 260, 1);
  setHud(H_.cores, window01(t, bu1.start - 0.1, bu3.start + 0.4), 0.05, 0.68, 170, 1);
  setHud(H_.clock, window01(t, bu2.start - 0.1, bu3.start + 0.4), 0.05, 0.48, 170, 1);
  setHud(H_.title, window01(t, bu3.start + 0.4, duration + 1, 0.5, 0.1), 0.5, 0.76, 300, 1);

  // ---- flashes and fades
  const flash = Math.max(1 - Math.abs(t - toMicro) / 0.22, 1 - Math.abs(t - toMacro) / 0.3, 0);
  const fade = Math.max(1 - seg(t, 0, 0.6, smooth), seg(t, duration - 0.9, duration - 0.1, smooth));
  pipe.hud.children.forEach(s => { s.material.opacity *= 1 - fade; });
  pipe.bloom.strength = inMicro ? 0.85 : 0.55;
  pipe.render(activeScene, activeCam, { flash: smooth(flash), fade, time: t });
  return renderer.domElement.toDataURL('image/jpeg', 0.93);
};

window.sceneDuration = duration;
window.sceneReady = true;
</script>
